<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilswaps Exchange</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        body { font-family: 'Inter', sans-serif; }
    </style>
    
    <!-- Load Lucide Icons (Vanilla JS version - exposes the 'lucide' global object) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        // Global function to call Lucide icon rendering after DOM manipulation
        window.createLucideIcons = () => {
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                // By default, Lucide finds all elements with data-lucide attribute and replaces them with SVGs.
                lucide.createIcons();
            }
        };
    </script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Main application container -->
    <div id="app" class="min-h-screen flex items-center justify-center p-4">
        <!-- Content will be injected here by JavaScript -->
        <div class="text-center p-20">Loading Application...</div>
    </div>

    <!-- Floating Status Modal for messages/alerts -->
    <div id="status-modal" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 p-3 rounded-lg shadow-2xl z-50 font-medium transition-opacity duration-300 opacity-0">
        Status Message
    </div>

    <!-- Firebase and Application Logic -->
    <script type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, addDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL STATE & CONFIG ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        // Ensure to parse the firebaseConfig string correctly
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        // Store initialAuthToken globally to be used for authentication
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null; 
        const EXCHANGE_RATE = 0.05; // 1 SC = $0.05 USD (simulated)

        let db = null;
        let auth = null;
        let unsubscribeOffers = null; // Store for the live offers listener
        let unsubscribeUserCoins = null; // Store for the user coin listener

        const state = {
            userId: null,
            userData: { coins: 0 },
            loading: true,
            page: 'auth', // 'auth' or 'dashboard'
            dashboardView: 'main', // 'main', 'profile', 'settings', 'wallet'
            offers: [], // Live offers from Firestore
            
            // Wallet state
            scToExchange: 0,
            withdrawalMethod: 'bank',
            bankAccount: { name: '', bankName: '', accountNumber: '' },
            upiDetails: { upiId: '', name: '' },
            cryptoDetails: { address: '', network: 'USDT (Polygon)' },
            payPalDetails: { email: '', name: '' },
        };

        // --- HELPER FUNCTIONS ---

        const getPublicCollectionPath = (collectionName) => {
            return `artifacts/${appId}/public/data/${collectionName}`;
        };
        
        // Manual state update and re-render function
        const setState = (newState) => {
            Object.assign(state, newState);
            renderApp();
        };

        // Custom alert/modal instead of native alert
        const appAlert = (message, isError = false) => {
            const modal = document.getElementById('status-modal');
            if (modal) {
                modal.textContent = message;
                modal.classList.remove('hidden', 'opacity-0');
                modal.classList.add('opacity-100');
                
                // Set colors
                modal.className = modal.className.replace(/bg-(green|red)-\d+/, '').replace(/text-(green|red)-\d+/, '');
                if (isError || message.includes('failed') || message.includes('Error') || message.includes('Critical')) {
                    modal.classList.add('bg-red-500', 'text-white');
                } else {
                    modal.classList.add('bg-green-500', 'text-white');
                }

                setTimeout(() => {
                    modal.classList.remove('opacity-100');
                    modal.classList.add('opacity-0');
                    setTimeout(() => modal.classList.add('hidden'), 300); // Wait for transition
                }, 3000);
            }
        };

        // --- FIREBASE INITIALIZATION & AUTH ---

        /**
         * Core function to handle the sign-in/re-authentication.
         * This function simulates the one-time verification by using the
         * provided custom token for quick, frictionless entry once Firebase is ready.
         */
        const handleSignIn = async () => {
            // CRITICAL FIX: Check if auth is initialized before use
            if (!auth) {
                appAlert("Error: Firebase Auth not initialized. Cannot proceed with sign-in. Check console for config errors.", true);
                return;
            }
            
            try {
                // Use the custom token if available (simulates persistent login token)
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    // Fallback to anonymous sign-in if no custom token is provided
                    await signInAnonymously(auth);
                }
                // The handleAuth listener will take over and transition to dashboard
                appAlert('Successfully signed in! Welcome to Skilswaps.');
            } catch (error) {
                console.error("Authentication failed:", error);
                appAlert(`Authentication Failed: ${error.message}. Please try again.`, true);
            }
        };

        const handleAuth = async (user) => {
            if (user) {
                const currentUserId = user.uid;
                setState({ userId: currentUserId, page: 'dashboard' });
                console.log(`User authenticated with ID: ${currentUserId}`);
                
                // CRITICAL FIX: Ensure db is initialized before trying to use it
                if (!db) {
                    console.error("Firestore database is not initialized. Cannot fetch user data.");
                    return;
                }

                // Clear old coin listener if it exists before setting a new one
                if (unsubscribeUserCoins) unsubscribeUserCoins();

                // Fetch or create initial user profile data (coins)
                const profileDocRef = doc(db, `artifacts/${appId}/users/${currentUserId}/profile/data`);
                const profileSnap = await getDoc(profileDocRef);

                if (profileSnap.exists()) {
                    setState({ userData: { coins: profileSnap.data().coins || 0 } });
                } else {
                    const starterCoins = 100;
                    await setDoc(profileDocRef, { coins: starterCoins, initialSetup: new Date().toISOString() });
                    setState({ userData: { coins: starterCoins } });
                }
                
                // Set up the listener for user coins (PRIVATE DATA) here, where auth is confirmed.
                unsubscribeUserCoins = onSnapshot(profileDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setState({ userData: { coins: docSnap.data().coins || 0 } });
                    }
                }, (error) => {
                    // Log error, but avoid visible appAlert for permission errors that often self-resolve
                    console.error("Error listening to user coins:", error); 
                });
                
                // Start listening to the public offers collection
                startLiveOffersListener();

            } else {
                // Cleanup on logout/no user
                setState({ userId: null, userData: { coins: 0 }, page: 'auth' });
                console.log("No user signed in.");
                if (unsubscribeOffers) unsubscribeOffers();
                if (unsubscribeUserCoins) unsubscribeUserCoins(); 
            }
            // Only set loading to false once the initial auth state is determined
            setState({ loading: false });
        };

        const initFirebaseAndAuth = () => {
            // CRITICAL GUARDRAIL: Check if configuration is available before attempting initialization
            if (Object.keys(firebaseConfig).length === 0 || !firebaseConfig.apiKey) {
                console.error("Critical Error: Firebase config is empty or invalid. Cannot initialize.");
                appAlert("Critical Error: Firebase configuration is missing. Login will not work.", true);
                setState({ loading: false });
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                // Assign global variables
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Listener setup: This listener determines the initial state (signed in or out)
                onAuthStateChanged(auth, handleAuth);

            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                appAlert(`Firebase Initialization Failed: ${error.message}`, true);
                setState({ loading: false });
            }
        };

        const handleLogout = async () => {
            if (auth) {
                try {
                    await signOut(auth);
                    appAlert("You have been successfully logged out.");
                    // onAuthStateChanged handles state update and listener cleanup
                } catch (error) {
                    console.error("Logout failed:", error);
                    appAlert(`Logout failed: ${error.message}`, true);
                }
            }
        };

        // --- FIREBASE DATA LISTENERS ---

        const startLiveOffersListener = () => {
            if (!db) return;

            // Clear previous listener if exists
            if (unsubscribeOffers) unsubscribeOffers();

            try {
                const offersCol = collection(db, getPublicCollectionPath('offers'));
                const q = query(offersCol);
                
                // Listen for real-time updates (PUBLIC DATA)
                unsubscribeOffers = onSnapshot(q, (snapshot) => {
                    const liveOffers = [];
                    snapshot.forEach(doc => {
                        liveOffers.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sort by timestamp if available, otherwise reverse to show latest first
                    liveOffers.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
                    
                    setState({ offers: liveOffers });
                }, (error) => {
                    console.error("Error listening to live offers:", error);
                    appAlert(`Error fetching live offers: ${error.message}`, true);
                });

            } catch (error) {
                console.error("Firestore setup error for offers:", error);
            }
        };

        // --- RENDER FUNCTIONS (Component Equivalents) ---

        const renderAuthCard = () => {
            const container = document.createElement('div');
            container.className = "w-full max-w-sm bg-white p-8 md:p-10 rounded-xl shadow-2xl border border-gray-200";
            
            // In vanilla JS, we can't use Lucide components directly, so we use placeholders or simple text
            const iconLock = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
            
            container.innerHTML = `
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold text-gray-900 mb-1 tracking-tight">Skilswaps</h1>
                    <div class="flex justify-center my-4">
                        <div class="bg-indigo-100 p-4 rounded-full text-indigo-600">
                            ${iconLock}
                        </div>
                    </div>
                    <h2 class="text-xl font-semibold text-gray-800 mt-2">Account Access</h2>
                    <p class="text-gray-500 text-sm mt-1">Choose your preferred sign-in method:</p>
                </div>

                <div class="space-y-4">
                    <!-- Functional Login Button (Simulating Google with the existing token) -->
                    <button id="auth-google" class="w-full flex items-center justify-center p-3 text-sm font-medium rounded-lg transition-all duration-200 bg-white text-gray-700 border-2 border-gray-200 shadow-sm hover:shadow-md active:scale-[0.98]">
                        <span class="text-xl mr-2">G</span> Continue with Google (Simulated)
                    </button>
                    
                    <button id="auth-apple" class="w-full flex items-center justify-center p-3 text-sm font-medium rounded-lg transition-all duration-200 bg-gray-800 text-white border-2 border-gray-800 shadow-sm hover:shadow-md active:scale-[0.98]">
                        <span class="text-xl mr-2"></span> Continue with Apple (Simulated)
                    </button>
                    <button id="auth-telegram" class="w-full flex items-center justify-center p-3 text-sm font-medium rounded-lg transition-all duration-200 bg-[#0088CC] text-white border-2 border-[#0088CC] shadow-sm hover:shadow-md active:scale-[0.98]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-icon mr-2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                        Continue with Telegram (Simulated)
                    </button>
                </div>

                <div class="relative flex justify-center items-center my-6">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                    <div class="relative bg-white px-3 text-sm text-gray-500 font-medium">OR</div>
                </div>

                <!-- Anonymous Login Button -->
                <button id="auth-relogin" class="w-full flex items-center justify-center p-3 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold shadow-xl transition-all duration-200 active:scale-[0.98]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user mr-2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Continue Anonymously (No Persistence)
                </button>
            `;
            
            // Event Listeners
            const simulatedAuth = (method) => appAlert(`Simulating login via ${method}. Click 'Continue with Google' for functional sign-in.`);
            container.querySelector('#auth-apple').addEventListener('click', () => simulatedAuth('Apple'));
            container.querySelector('#auth-telegram').addEventListener('click', () => simulatedAuth('Telegram'));

            // Functional Google Login listener (now mandatory for entry)
            container.querySelector('#auth-google').addEventListener('click', handleSignIn);

            // Anonymous Login listener (can be used if token is missing)
            container.querySelector('#auth-relogin').addEventListener('click', () => {
                // Temporarily override initialAuthToken to ensure anonymous sign-in is used
                const originalToken = initialAuthToken;
                state.initialAuthToken = null;
                handleSignIn();
                state.initialAuthToken = originalToken; // Restore token
            });

            return container;
        };
        
        // --- SkillPostForm Render and Logic ---

        const handlePost = async (e) => {
            e.preventDefault();
            const skillToTeach = document.getElementById('skill-to-teach').value;
            const skillToLearn = document.getElementById('skill-to-learn').value;

            if (!skillToTeach || !skillToLearn) {
                appAlert('Please specify both skills.', true);
                return;
            }
            
            try {
                const offersRef = collection(db, getPublicCollectionPath('offers'));
                await addDoc(offersRef, {
                    teach: skillToTeach,
                    learn: skillToLearn,
                    userId: state.userId,
                    location: 'Remote/Global',
                    timestamp: new Date().toISOString(),
                });

                appAlert(`Successfully posted skilswaps offer!`);
                
                // Reset form inputs manually
                document.getElementById('skill-to-teach').value = '';
                document.getElementById('skill-to-learn').value = '';

            } catch (error) {
                console.error("Error posting document: ", error);
                appAlert(`Failed to post offer: ${error.message}`, true);
            }
        };

        const renderSkillPostForm = () => {
            const container = document.createElement('div');
            container.className = "bg-white p-6 rounded-lg shadow-md border border-indigo-100 mb-6";
            container.innerHTML = `
                <h3 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Post Your Offer</h3>
                <form id="post-offer-form">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">I Want to Teach:</label>
                            <input type="text" id="skill-to-teach" placeholder="e.g., Python Programming" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">I Want to Learn:</label>
                            <input type="text" id="skill-to-learn" placeholder="e.g., Digital Marketing" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" />
                        </div>
                    </div>
                    <button type="submit" class="w-full flex items-center justify-center p-3 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold shadow-md transition-all duration-200 active:scale-[0.98]">
                        Post Skilswaps
                    </button>
                </form>
            `;
            container.querySelector('#post-offer-form').addEventListener('submit', handlePost);
            return container;
        };

        // --- LiveOffersList Render and Logic ---

        const handleDelete = async (id) => {
            // Using a custom modal instead of window.confirm
            const confirmationModal = document.createElement('div');
            confirmationModal.className = "fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50";
            confirmationModal.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
                    <h4 class="text-xl font-semibold mb-3">Confirm Deletion</h4>
                    <p class="mb-6 text-gray-600">Are you sure you want to delete this offer? This action cannot be undone.</p>
                    <div class="flex justify-center space-x-4">
                        <button id="cancel-delete" class="px-5 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 font-medium transition">Cancel</button>
                        <button id="confirm-delete" class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition">Delete</button>
                    </div>
                </div>
            `;
            document.body.appendChild(confirmationModal);

            return new Promise((resolve) => {
                const cleanUp = () => document.body.removeChild(confirmationModal);
                
                confirmationModal.querySelector('#cancel-delete').addEventListener('click', () => {
                    cleanUp();
                    resolve(false);
                });

                confirmationModal.querySelector('#confirm-delete').addEventListener('click', async () => {
                    cleanUp();
                    try {
                        const docRef = doc(db, getPublicCollectionPath('offers'), id);
                        await deleteDoc(docRef);
                        appAlert("Offer successfully deleted.");
                        resolve(true);
                    } catch (error) {
                        console.error("Error deleting document: ", error);
                        appAlert(`Failed to delete offer: ${error.message}`, true);
                        resolve(false);
                    }
                });
            });
        };

        const renderLiveOffersList = () => {
            const container = document.createElement('div');
            container.className = "bg-white p-6 rounded-lg shadow-md border border-gray-200";
            
            let offersHTML = `<h3 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Live Skilswaps Offers (${state.offers.length})</h3>`;
            
            if (state.offers.length === 0) {
                offersHTML += `
                    <div class="text-center py-10 text-gray-500">
                        <span data-lucide="Zap" class="lucide lucide-zap mx-auto mb-2 text-yellow-500 w-8 h-8"></span>
                        <p>No offers posted yet. Be the first!</p>
                    </div>
                `;
            } else {
                offersHTML += `<div class="space-y-4" id="offers-list">`;
                state.offers.forEach(offer => {
                    const isCurrentUser = offer.userId === state.userId;
                    offersHTML += `
                        <div class="p-4 border border-gray-100 rounded-lg shadow-sm hover:shadow-md transition duration-150 flex justify-between items-start bg-gray-50">
                            <div class='flex-1 pr-4'>
                                <p class="font-semibold text-indigo-700">Teach: ${offer.teach}</p>
                                <p class="text-sm text-gray-600">Learn: <span class="font-medium text-gray-800">${offer.learn}</span></p>
                                <p class="text-xs text-gray-400 mt-1">
                                    Posted: ${offer.timestamp ? new Date(offer.timestamp).toLocaleString() : 'N/A'}
                                </p>
                            </div>
                            <div class="text-right text-sm">
                                <p class="text-gray-500 flex items-center justify-end">
                                    <span data-lucide="User" class="w-4 h-4 mr-1"></span>
                                    ${offer.userId.substring(0, 8)}...
                                </p>
                                <p class="text-gray-500 flex items-center justify-end mt-1">
                                    <span data-lucide="MapPin" class="w-4 h-4 mr-1"></span>
                                    ${offer.location || 'N/A'}
                                </p>
                                
                                <div class="mt-2 space-y-1">
                                    ${isCurrentUser ? 
                                        `<button data-id="${offer.id}" class="delete-offer w-full text-xs font-semibold text-white bg-red-500 px-3 py-1 rounded-full hover:bg-red-600 transition-colors">Delete</button>`
                                        : 
                                        `<button class="w-full text-xs font-semibold text-white bg-green-500 px-3 py-1 rounded-full hover:bg-green-600 transition-colors">Swap</button>`
                                    }
                                </div>
                            </div>
                        </div>
                    `;
                });
                offersHTML += `</div>`;
            }

            container.innerHTML = offersHTML;

            // Attach event listeners for delete buttons
            container.querySelectorAll('.delete-offer').forEach(button => {
                button.addEventListener('click', (e) => handleDelete(e.target.dataset.id));
            });
            
            // Call the global icon function
            window.createLucideIcons();

            return container;
        };

        // --- Wallet Sub-Components ---
        
        const renderWalletForms = (parent, type) => {
            let details;
            let formHTML;
            let updateHandler;

            const inputClass = "w-full p-3 border border-gray-300 rounded-lg";
            const selectClass = inputClass + " focus:ring-indigo-500 focus:border-indigo-500 appearance-none";

            switch (type) {
                case 'bank':
                    details = state.bankAccount;
                    updateHandler = (key, value) => { state.bankAccount[key] = value; };
                    formHTML = `
                        <div class="space-y-4">
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">Full Name on Account:</label><input type="text" id="bank-name" value="${details.name}" placeholder="John Doe" class="${inputClass}" /></div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Bank Name/Code (e.g., IFSC/SWIFT):</label><input type="text" id="bank-bankName" value="${details.bankName}" placeholder="e.g., CHASUS33 or IFSC" class="${inputClass}" /></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Account Number (or IBAN):</label><input type="text" id="bank-accountNumber" value="${details.accountNumber}" placeholder="1234567890" class="${inputClass}" /></div>
                            </div>
                        </div>
                    `;
                    break;
                case 'crypto':
                    details = state.cryptoDetails;
                    updateHandler = (key, value) => { state.cryptoDetails[key] = value; };
                    formHTML = `
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Crypto Network/Coin:</label>
                                <select id="crypto-network" class="${selectClass}">
                                    <option value="USDT (Polygon)" ${details.network === 'USDT (Polygon)' ? 'selected' : ''}>USDT (Polygon)</option>
                                    <option value="ETH (ERC-20)" ${details.network === 'ETH (ERC-20)' ? 'selected' : ''}>ETH (ERC-20)</option>
                                    <option value="BTC (SegWit)" ${details.network === 'BTC (SegWit)' ? 'selected' : ''}>BTC (SegWit)</option>
                                    <option value="USDC (Solana)" ${details.network === 'USDC (Solana)' ? 'selected' : ''}>USDC (Solana)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Wallet Address:</label>
                                <input type="text" id="crypto-address" value="${details.address}" placeholder="0x..." class="${inputClass}" />
                                <p class="text-xs text-red-500 mt-1">Double check the address and network! Funds sent to the wrong network will be lost.</p>
                            </div>
                        </div>
                    `;
                    break;
                case 'upi':
                    details = state.upiDetails;
                    updateHandler = (key, value) => { state.upiDetails[key] = value; };
                    formHTML = `
                        <div class="space-y-4">
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">Full Name (as registered with UPI):</label><input type="text" id="upi-name" value="${details.name}" placeholder="Jane Doe" class="${inputClass}" /></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">UPI ID (VPA):</label><input type="text" id="upi-upiId" value="${details.upiId}" placeholder="johndoe@bank" class="${inputClass}" /></div>
                        </div>
                    `;
                    break;
                case 'paypal':
                    details = state.payPalDetails;
                    updateHandler = (key, value) => { state.payPalDetails[key] = value; };
                    formHTML = `
                        <div class="space-y-4">
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">PayPal Account Email:</label><input type="email" id="paypal-email" value="${details.email}" placeholder="your.email@example.com" class="${inputClass}" /></div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name (Optional, for verification):</label>
                                <input type="text" id="paypal-name" value="${details.name}" placeholder="Full Name" class="${inputClass}" />
                                <p class="text-xs text-gray-500 mt-1">Withdrawals go directly to this PayPal email address.</p>
                            </div>
                        </div>
                    `;
                    break;
                default:
                    return;
            }

            parent.innerHTML = formHTML;

            // Attach dynamic listeners based on the form type
            parent.querySelectorAll('input, select').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idParts = e.target.id.split('-');
                    const key = idParts[1]; // e.g., 'name', 'accountNumber'
                    updateHandler(key, e.target.value);
                });
            });
        };

        // --- WalletAndExchange Render and Logic ---

        const handleWithdrawal = async (e) => {
            e.preventDefault();
            const scToExchange = state.scToExchange;
            const convertedAmount = (scToExchange * EXCHANGE_RATE).toFixed(2);
            let withdrawalTarget = '';
            let isValid = false;
            let methodLabel = '';

            if (scToExchange === 0) {
                appAlert('Please enter an amount greater than 0 SC to exchange.', true);
                return;
            }
            if (scToExchange > state.userData.coins) {
                appAlert('Insufficient coins for this withdrawal.', true);
                return;
            }

            // Validation logic
            const details = state[`${state.withdrawalMethod}Details`] || state.bankAccount;
            if (state.withdrawalMethod === 'bank') {
                isValid = state.bankAccount.accountNumber && state.bankAccount.name && state.bankAccount.bankName;
                withdrawalTarget = `Bank A/C ending in ***${state.bankAccount.accountNumber.slice(-4)}`;
                methodLabel = 'Bank Account';
            } else if (state.withdrawalMethod === 'crypto') {
                isValid = details.address && details.network;
                withdrawalTarget = `${details.network} address starting with ${details.address.substring(0, 6)}...`;
                methodLabel = 'Crypto Wallet';
            } else if (state.withdrawalMethod === 'upi') {
                isValid = details.upiId && details.name;
                withdrawalTarget = `UPI ID: ${details.upiId}`;
                methodLabel = 'UPI/GPay';
            } else if (state.withdrawalMethod === 'paypal') {
                isValid = details.email && details.email.includes('@');
                withdrawalTarget = `PayPal Email: ${details.email}`;
                methodLabel = 'PayPal';
            }

            if (!isValid) {
                appAlert(`Please complete all required fields for your ${methodLabel} withdrawal.`, true);
                return;
            }

            // Real Withdrawal Logic using Firestore
            try {
                const userDocRef = doc(db, `artifacts/${appId}/users/${state.userId}/profile/data`);
                
                // Atomically update coins
                const newCoins = state.userData.coins - scToExchange;
                await setDoc(userDocRef, { coins: newCoins }, { merge: true });
                
                appAlert(`Processing withdrawal of $${convertedAmount} to ${withdrawalTarget}...`);

                // Simulate success after delay and update local state and reset form
                setTimeout(() => {
                    setState({ scToExchange: 0 }); // Reset SC to exchange
                    appAlert(`✅ Withdrawal successful! $${convertedAmount} sent to your ${methodLabel}.`);
                }, 3000);
                
            } catch (error) {
                console.error("Withdrawal failed:", error);
                appAlert(`❌ Withdrawal failed due to system error: ${error.message}`, true);
            }
        };

        const renderWalletAndExchange = (container) => {
            const convertedAmount = (state.scToExchange * EXCHANGE_RATE).toFixed(2);
            
            const withdrawalMethodTabs = [
                { key: 'bank', label: 'Bank Account', icon: 'Landmark' },
                { key: 'crypto', label: 'Crypto Wallet', icon: 'Wallet' },
                { key: 'upi', label: 'UPI / GPay', icon: 'CornerUpRight' }, 
                { key: 'paypal', label: 'PayPal', icon: 'CreditCard' }, 
            ];

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center text-indigo-600 hover:text-indigo-800 font-semibold mb-4 p-2 -ml-2 rounded-lg transition-colors duration-150 cursor-pointer" id="go-back-main">
                        <span data-lucide="ChevronLeft" class="w-5 h-5 mr-1"></span>
                        Back to Main Exchange
                    </div>
                    
                    <div class="bg-indigo-600 text-white p-6 rounded-xl shadow-lg flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <span data-lucide="DollarSign" class="w-8 h-8 text-yellow-300"></span>
                            <h2 class="text-2xl font-bold">Your Skilswaps Wallet</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-medium">Total SC Balance:</p>
                            <p class="text-4xl font-extrabold text-yellow-300">${state.userData.coins} SC</p>
                        </div>
                    </div>

                    <!-- Exchange Section -->
                    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2 flex items-center">
                            <span data-lucide="Banknote" class="w-5 h-5 mr-2 text-green-600"></span>
                            Coin Exchange
                        </h3>
                        
                        <p class="text-sm text-gray-600 mb-4">
                            Current simulated rate: <span class="font-semibold text-green-600">1 SC ≈ $${EXCHANGE_RATE} USD</span>
                        </p>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 items-end">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">SC to Exchange (Max ${state.userData.coins}):</label>
                                <input type="number" id="sc-to-exchange" value="${state.scToExchange}" max="${state.userData.coins}" min="0" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" />
                            </div>
                            <div class="flex items-center justify-center text-xl font-bold text-indigo-600 hidden md:block">
                                <span data-lucide="ArrowRightLeft" class="inline w-5 h-5"></span>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Withdrawal Amount:</label>
                                <div class="w-full p-3 bg-indigo-50 text-indigo-700 rounded-lg font-bold border border-indigo-200">
                                    $${convertedAmount} USD
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-6">
                            <p class="font-semibold ${state.scToExchange > 0 ? 'text-indigo-600' : 'text-gray-500'}">
                                ${state.scToExchange} SC will convert to $${convertedAmount} USD.
                            </p>
                        </div>
                    </div>
                    
                    <!-- Withdrawal Section -->
                    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">
                            Withdrawal Method
                        </h3>
                        
                        <!-- Method Tabs -->
                        <div class="flex justify-around space-x-2 p-1 bg-gray-50 rounded-lg mb-6" id="withdrawal-tabs">
                            <!-- Tabs injected here -->
                        </div>

                        <form id="withdrawal-form" class="space-y-6">
                            <div id="dynamic-withdrawal-form">
                                <!-- Dynamic Form Content injected here -->
                            </div>
                            
                            <button type="submit" id="confirm-withdrawal" 
                                class="w-full flex items-center justify-center p-3 text-white bg-green-600 hover:bg-green-700 rounded-lg font-semibold shadow-md transition-all duration-200 active:scale-[0.98] disabled:opacity-50 mt-6"
                                disabled
                            >
                                Confirm Withdrawal of $${convertedAmount} USD
                            </button>
                            <p class="text-xs text-gray-500 text-center pt-2">
                                Note: Transactions are processed on a simulated network. Actual withdrawal times may vary based on method.
                            </p>
                        </form>
                    </div>
                </div>
            `;
            
            // Attach Go Back button listener
            container.querySelector('#go-back-main').addEventListener('click', () => setState({ dashboardView: 'main' }));

            // Attach SC to Exchange input listener
            const scInput = container.querySelector('#sc-to-exchange');
            scInput.addEventListener('input', (e) => {
                const value = parseInt(e.target.value) || 0;
                let newSc = value;
                if (value > state.userData.coins) {
                    newSc = state.userData.coins;
                    e.target.value = newSc; // Cap the input field
                } else if (value < 0) {
                    newSc = 0;
                    e.target.value = newSc;
                }
                setState({ scToExchange: newSc });
                // Re-render the wallet view to update the estimated amount and button state
                renderWalletAndExchange(container);
            });
            
            // Attach form submission listener
            container.querySelector('#withdrawal-form').addEventListener('submit', handleWithdrawal);
            
            // Render tabs
            const tabsContainer = container.querySelector('#withdrawal-tabs');
            tabsContainer.innerHTML = withdrawalMethodTabs.map(tab => `
                <button data-key="${tab.key}" class="wallet-tab flex-1 flex items-center justify-center p-3 rounded-md font-semibold transition-all duration-200
                    ${state.withdrawalMethod === tab.key ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-700 hover:bg-indigo-100'}">
                    <span data-lucide="${tab.icon}" class="w-5 h-5 mr-2"></span>
                    ${tab.label}
                </button>
            `).join('');

            // Attach tab click listeners
            tabsContainer.querySelectorAll('.wallet-tab').forEach(tabButton => {
                tabButton.addEventListener('click', (e) => {
                    const key = e.currentTarget.dataset.key;
                    setState({ withdrawalMethod: key });
                    renderWalletAndExchange(container); // Re-render to show new form
                });
            });

            // Render dynamic form content
            const dynamicFormContainer = container.querySelector('#dynamic-withdrawal-form');
            renderWalletForms(dynamicFormContainer, state.withdrawalMethod);

            // Update confirmation button state and text
            const confirmButton = container.querySelector('#confirm-withdrawal');
            const isDisabled = state.scToExchange === 0 || state.userData.coins < state.scToExchange;
            confirmButton.disabled = isDisabled;
            confirmButton.textContent = `Confirm Withdrawal of $${convertedAmount} USD`;

            // After injection, create Lucide icons
            window.createLucideIcons();

            return container;
        };

        // --- Dashboard Render ---

        const renderDashboard = () => {
            const container = document.createElement('div');
            container.className = "min-h-screen bg-gray-100 p-6 font-inter w-full max-w-7xl mx-auto";

            // Main dashboard structure
            container.innerHTML = `
                <header class="bg-white p-4 rounded-xl shadow-lg flex justify-between items-center mb-6">
                    <div class="flex items-center space-x-4">
                        <h1 class="text-2xl font-extrabold text-indigo-700">Skilswaps Exchange</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center bg-yellow-100 text-yellow-800 p-2 rounded-full font-bold text-sm shadow-inner">
                            <span data-lucide="DollarSign" class="w-4 h-4 mr-1 text-yellow-600"></span>
                            <span>${state.userData.coins} SC</span>
                        </div>
                        <div class="hidden sm:block text-xs text-gray-500 bg-gray-50 p-2 rounded-lg border">
                             Logged in: <span class="font-mono">${state.userId}</span>
                        </div>
                        <button id="logout-button" class="text-sm text-red-600 hover:text-red-800 font-medium py-2 px-3 rounded-lg border border-red-300 transition-colors hover:bg-red-50">
                            Log Out
                        </button>
                    </div>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <nav class="lg:col-span-1 bg-white p-4 rounded-xl shadow-lg h-fit">
                        <h3 class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">Menu</h3>
                        <div class="space-y-1" id="nav-menu">
                            <!-- Nav Items injected here -->
                        </div>
                    </nav>
                    <main class="lg:col-span-3 space-y-6" id="dashboard-content">
                        <!-- Content injected here -->
                    </main>
                </div>
            `;
            
            // Attach event listener for logout
            container.querySelector('#logout-button').addEventListener('click', handleLogout);

            // Setup Navigation
            const navMenu = container.querySelector('#nav-menu');
            const navItems = [
                { key: 'main', label: 'Main Exchange', icon: 'Send' },
                { key: 'wallet', label: 'Wallet & Exchange', icon: 'Banknote' },
                { key: 'profile', label: 'Personal Details', icon: 'User' },
                { key: 'settings', label: 'Settings', icon: 'Settings' },
            ];

            navMenu.innerHTML = navItems.map(item => `
                <button data-view="${item.key}" class="nav-item flex items-center space-x-2 p-3 rounded-lg transition-all duration-200 
                            ${state.dashboardView === item.key ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}">
                    <span data-lucide="${item.icon}" class="w-5 h-5"></span>
                    <span class="font-medium">${item.label}</span>
                </button>
            `).join('');

            // Attach event listeners to nav items
            container.querySelectorAll('.nav-item').forEach(button => {
                button.addEventListener('click', (e) => {
                    setState({ dashboardView: e.currentTarget.dataset.view });
                });
            });

            // Render main content based on view
            const contentContainer = container.querySelector('#dashboard-content');
            
            switch (state.dashboardView) {
                case 'profile':
                    contentContainer.innerHTML = `
                        <div class="p-6 bg-white rounded-xl shadow-lg space-y-4">
                            <button class="go-back-main flex items-center text-indigo-600 hover:text-indigo-800 font-semibold mb-4 p-2 -ml-2 rounded-lg transition-colors duration-150">
                                <span data-lucide="ChevronLeft" class="w-5 h-5 mr-1"></span>
                                Back to Main Exchange
                            </button>
                            <h2 class="text-2xl font-bold text-indigo-700 mb-2">Personal Details & Profile</h2>
                            <p class="text-gray-700">Here you can edit your name, bio, skills taught, and skills learned.</p>
                            <div class="mt-4 p-4 border rounded-lg bg-indigo-50">
                                <p class="font-mono text-sm text-indigo-800">User ID: ${state.userId}</p>
                            </div>
                        </div>
                    `;
                    contentContainer.querySelector('.go-back-main').addEventListener('click', () => setState({ dashboardView: 'main' }));
                    break;
                case 'settings':
                    contentContainer.innerHTML = `
                        <div class="p-6 bg-white rounded-xl shadow-lg space-y-4">
                            <button class="go-back-main flex items-center text-indigo-600 hover:text-indigo-800 font-semibold mb-4 p-2 -ml-2 rounded-lg transition-colors duration-150">
                                <span data-lucide="ChevronLeft" class="w-5 h-5 mr-1"></span>
                                Back to Main Exchange
                            </button>
                            <h2 class="text-2xl font-bold text-indigo-700 mb-2">App Settings</h2>
                            <p class="text-gray-700">Manage notifications, privacy controls, and app preferences.</p>
                        </div>
                    `;
                    contentContainer.querySelector('.go-back-main').addEventListener('click', () => setState({ dashboardView: 'main' }));
                    break;
                case 'wallet':
                    renderWalletAndExchange(contentContainer);
                    break;
                case 'main':
                default:
                    // Main view: Skill Post Form and Live Offers List
                    contentContainer.appendChild(renderSkillPostForm());
                    contentContainer.appendChild(renderLiveOffersList());
                    break;
            }

            // After injection, create Lucide icons (MUST BE CALLED AFTER DOM MANIPULATION)
            window.createLucideIcons();

            return container;
        };

        // --- MAIN APPLICATION RENDERER ---

        const renderApp = () => {
            const appRoot = document.getElementById('app');
            appRoot.innerHTML = ''; // Clear previous content

            if (state.loading) {
                appRoot.className = "min-h-screen flex items-center justify-center p-4";
                appRoot.innerHTML = `
                    <div class="flex items-center fixed inset-0 bg-gray-100 justify-center z-40">
                        <div class="flex items-center p-8 bg-white rounded-xl shadow-lg">
                            <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-b-4 border-indigo-600 mr-4"></div>
                            <p class="text-indigo-600 font-medium text-lg">Initializing Skilswaps...</p>
                        </div>
                    </div>
                `;
            } else if (state.page === 'auth' || !state.userId) {
                appRoot.className = "min-h-screen bg-gray-100 flex items-center justify-center p-4";
                appRoot.appendChild(renderAuthCard());
            } else {
                appRoot.className = ""; // Remove centering class for dashboard layout
                appRoot.appendChild(renderDashboard());
            }
        };

        // --- START APPLICATION ---
        window.onload = initFirebaseAndAuth;
    </script>
</body>
</html>
